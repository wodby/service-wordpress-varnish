name: wordpress-varnish
type: service
from: varnish
guidance: GUIDANCE.md
fromVersionConstraint: "^1.0.0"
fromVersion: "1.0.15"
title: Varnish (WordPress)


labels:
- wordpress
- varnish

configs:
- name: wordpress
  title: WordPress preset
  filepath: /etc/gotpl/presets/wordpress.vcl.tmpl
  default:
    source: image
    filepath: /etc/gotpl/presets/wordpress.vcl.tmpl

env:
- name: VARNISH_CONFIG_PRESET
  value: wordpress
